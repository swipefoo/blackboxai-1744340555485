version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - whatsapp-bot-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - whatsapp-bot-network

networks:
  whatsapp-bot-network:
    driver: bridge
